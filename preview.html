  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Hanken+Grotesk:wght@400;600&display=swap">
  <style>/* HM Store — Design tokens.
 * Fuente: Paleta_de_Colores_HM_Store.md y Contexto_Real_HM_Store_para_Claude.md.
 * Rosa #F653BD = aproximación digital tomada del logotipo, NO valor oficial verificado.
 * No añadir colores de marca sin aprobación de HM. */
:root {
  /* Paleta de trabajo seleccionada */
  --hm-pink: #F653BD;
  --hm-black: #000000;
  --hm-white: #FFFFFF;
  --hm-gray-soft: #F5F3F4;
  --hm-gray-medium: #777777;
  --hm-gray-light: #E8E5E7;

  /* Ajuste de accesibilidad (propuesta): gris neutro algo más oscuro para texto pequeño,
   * porque #777777 sobre blanco da 4.48:1 y sobre gris suave 4.05:1 (<4.5). Pendiente de aprobación. */
  --hm-text-soft: #666666;

  /* Roles */
  --color-bg: var(--hm-white);
  --color-surface: var(--hm-gray-soft);
  --color-line: var(--hm-gray-light);
  --color-ui: var(--hm-gray-medium);
  --color-ink: var(--hm-black);
  --color-ink-soft: var(--hm-text-soft);
  --color-accent: var(--hm-pink);
  --color-focus: var(--hm-black);

  /* Estados: solo con la paleta. El rojo de error es funcional y está pendiente de aprobación. */
  --err-fg: #b3261e; --err-bg: #fbe9e7;

  /* Tema de campaña del Hero: lo sobrescribe js/hero.js desde data/campaigns.js */
  --bg: var(--hm-gray-soft);
  --ink: var(--hm-black);
  --accent: var(--hm-pink);
  --paper: var(--hm-white);

  /* Tipografía */
  --font-display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs-display: clamp(3.25rem, 9vw, 8.25rem);
  --fs-h2: clamp(2rem, 4.5vw, 3.5rem);
  --fs-h3: clamp(1.25rem, 2vw, 1.5rem);
  --fs-product: 1.0625rem;
  --fs-price: 1rem;
  --fs-body: 1rem;
  --fs-small: 0.875rem;
  --fs-label: 0.75rem;
  --ls-label: 0.14em;

  /* Espaciado (base 4px) */
  --sp-1: 0.25rem; --sp-2: 0.5rem; --sp-3: 0.75rem; --sp-4: 1rem;
  --sp-5: 1.5rem; --sp-6: 2rem; --sp-7: 3rem; --sp-8: 4rem;
  --gutter: clamp(1.25rem, 5vw, 5rem);
  --container: 1280px;
  --section-y: clamp(4rem, 9vw, 7.5rem);
  --grid-gap: clamp(1rem, 2.5vw, 2rem);

  /* Forma */
  --radius-s: 2px;
  --radius-pill: 999px;
  --tap: 44px;

  /* Movimiento */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --t-fast: 160ms;
  --t-med: 300ms;

  /* Layout */
  --header-h: 84px;
  --announce-h: 0px;
}
@media (max-width: 900px) { :root { --header-h: 68px; } }
</style>
  <style>/* HM Store — base: reset, tipografía, utilidades, foco. */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 1rem); }
body { margin: 0; background: var(--color-bg); color: var(--color-ink); font-family: var(--font-body); font-size: var(--fs-body); line-height: 1.5; }
::selection { background: var(--hm-pink); color: #000; }
img { display: block; max-width: 100%; }
h1, h2, h3, p { margin: 0; }
button, input { font: inherit; color: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 3px; }
.container { width: 100%; max-width: calc(var(--container) + 2 * var(--gutter)); margin-inline: auto; padding-inline: var(--gutter); }
.section { padding-block: var(--section-y); }
.section--surface { background: var(--color-surface); }
.skip-link { position: absolute; left: var(--sp-4); top: -100px; z-index: 10; background: #000; color: #fff; padding: var(--sp-3) var(--sp-4); }
.skip-link:focus { top: var(--sp-4); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
  <style>/* HM Store — componentes reutilizables (Fase 2). */

/* ---------- Cinta de anuncio ---------- */
.announce { background: #000; color: #fff; overflow: hidden; height: 40px; }
.announce[hidden] { display: none; }
.announce__link { display: flex; align-items: center; height: 100%; color: inherit; text-decoration: none; overflow: hidden; font-size: 0.8125rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
.announce__link:hover .announce__track, .announce__link:focus-visible .announce__track { animation-play-state: paused; }
.announce__link:focus-visible { outline-color: var(--hm-pink); outline-offset: -3px; }
.announce__track { display: inline-flex; flex: none;  will-change: transform; animation: marquee var(--marquee-duration, 30s) linear infinite; }
.announce__item { padding-inline: 2.5rem; display: inline-flex; align-items: center; gap: 2.5rem; }
.announce__item::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--hm-pink); }
@keyframes marquee { to { transform: translateX(-50%); } }
@media (max-width: 900px) { .announce { height: 36px; } }

/* ---------- Cabecera ---------- */
.site-header { position: sticky; top: 0; z-index: 5; background: var(--color-bg); height: var(--header-h); border-bottom: 1px solid var(--color-line);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-inline: var(--gutter); }
.site-header__logo { display: block; height: var(--header-h); padding: 14px 0; justify-self: center; }
.site-header__logo img { height: 100%; width: auto; }
.nav { display: flex; gap: var(--sp-5); }
.nav__link { display: inline-flex; align-items: center; min-height: var(--tap); color: var(--color-ink); text-decoration: none; font-size: var(--fs-small); font-weight: 600; letter-spacing: var(--ls-label); text-transform: uppercase; background: linear-gradient(currentColor, currentColor) left bottom 10px / 0 1.5px no-repeat; transition: background-size var(--t-med) var(--ease-out); }
.nav__link:hover, .nav__link[aria-current] { background-size: 100% 1.5px; }

/* ---------- Botones ---------- */
.btn { --btn-bg: var(--hm-black); --btn-fg: var(--hm-white); --btn-border: var(--hm-black); --btn-hover-bg: var(--hm-pink); --btn-hover-fg: #000;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.75rem; min-height: 52px; padding: 0 1.75rem;
  background: var(--btn-bg); color: var(--btn-fg); border: 1.5px solid var(--btn-border); border-radius: var(--radius-pill);
  text-decoration: none; cursor: pointer; font-weight: 600; font-size: 0.9375rem; letter-spacing: 0.08em; text-transform: uppercase;
  transition: background-color var(--t-fast) ease, color var(--t-fast) ease, transform var(--t-fast) var(--ease-out); }
.btn svg { transition: transform 200ms var(--ease-out); }
.btn:hover { background: var(--btn-hover-bg); color: var(--btn-hover-fg); }
.btn:hover svg { transform: translateX(4px); }
.btn:active { transform: scale(0.97); }
.btn--secondary { --btn-bg: transparent; --btn-fg: var(--hm-black); --btn-hover-bg: var(--hm-black); --btn-hover-fg: var(--hm-white); }
.btn--ghost { --btn-bg: transparent; --btn-fg: var(--hm-black); --btn-border: transparent; --btn-hover-bg: var(--hm-gray-light); --btn-hover-fg: var(--hm-black); }
.btn--sm { min-height: var(--tap); padding: 0 1.25rem; font-size: 0.8125rem; }
.btn--block { width: 100%; }
.btn[aria-disabled="true"], .btn:disabled { background: transparent; color: var(--btn-border); border-style: dashed; cursor: not-allowed; }
.btn[aria-disabled="true"]:hover, .btn:disabled:hover { background: transparent; color: var(--btn-border); }
.btn[aria-disabled="true"]:hover svg, .btn:disabled:hover svg { transform: none; }
.btn[aria-disabled="true"]:active, .btn:disabled:active { transform: none; }

/* ---------- Encabezado de sección ---------- */
.section-head { display: grid; gap: var(--sp-3); margin-bottom: var(--sp-7); max-width: 40rem; }
.eyebrow { font-size: var(--fs-label); letter-spacing: var(--ls-label); text-transform: uppercase; font-weight: 600; color: var(--color-ink-soft); }
.section-head__title { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: var(--fs-h2); line-height: 1; letter-spacing: -0.02em; text-wrap: balance; }
.section-head__text { color: var(--color-ink-soft); max-width: 46ch; text-wrap: pretty; }

/* ---------- Etiquetas de disponibilidad (punto + texto: nunca solo color) ---------- */
.tag { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.25rem 0.65rem; border-radius: var(--radius-pill); font-size: var(--fs-label); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; background: var(--hm-gray-light); color: var(--hm-black); }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.tag--ok { background: var(--hm-white); border: 1px solid var(--hm-gray-light); }
.tag--ok::before { background: var(--hm-pink); }
.tag--low { background: var(--hm-pink); color: var(--hm-black); }
.tag--out { background: var(--hm-gray-light); color: var(--color-ink-soft); }
.tag--out::before { border-radius: 1px; }

/* ---------- Tarjeta de producto ---------- */
.product-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-6) var(--grid-gap); list-style: none; margin: 0; padding: 0; }
@media (max-width: 1100px) { .product-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 820px) { .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card { position: relative; display: grid; gap: var(--sp-3); align-content: start; }
.card__media { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--hm-gray-light); border-radius: var(--radius-s); }
.card__media img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform 600ms var(--ease-out); }
.card__ph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: var(--sp-4); font-size: var(--fs-label); letter-spacing: var(--ls-label); text-transform: uppercase; font-weight: 600; color: var(--color-ink-soft); }
.card__tag { position: absolute; left: var(--sp-3); top: var(--sp-3); }
.card__body { display: grid; gap: var(--sp-1); }
.card__brand { font-size: var(--fs-label); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--color-ink-soft); font-weight: 600; }
.card__title { font-size: var(--fs-product); font-weight: 600; line-height: 1.3; }
.card__link { color: inherit; text-decoration: none; }
.card__link::after { content: ""; position: absolute; inset: 0; } /* enlace extendido: toda la tarjeta es clicable */
.card__link:focus-visible { outline: none; }
.card:has(.card__link:focus-visible) .card__media { outline: 3px solid var(--color-focus); outline-offset: 3px; }
.card__price { font-size: var(--fs-price); font-variant-numeric: tabular-nums; }
.card__colors { display: flex; gap: 6px; margin-top: var(--sp-1); }
.card__dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, 0.25); background: var(--c, #ccc); }
.card:hover .card__media img { transform: scale(1.03); }
.card--soldout .card__media { opacity: 0.6; }
.card--soldout .card__title { color: var(--color-ink-soft); }
.card--demo .card__media::after { content: "Ejemplo"; position: absolute; right: var(--sp-3); top: var(--sp-3); background: #000; color: #fff; font-size: 0.6875rem; letter-spacing: var(--ls-label); text-transform: uppercase; font-weight: 600; padding: 0.25rem 0.6rem; border-radius: var(--radius-s); }

/* ---------- Selectores de variante (CSS puro: input real + etiqueta) ---------- */
.field { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: var(--sp-3); }
.field__legend { padding: 0; font-size: var(--fs-label); letter-spacing: var(--ls-label); text-transform: uppercase; font-weight: 600; }
.field__legend output { color: var(--color-ink-soft); font-weight: 400; letter-spacing: 0.04em; text-transform: none; margin-left: var(--sp-2); }
.opts { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.opt { position: relative; }
.opt input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.chip { display: inline-flex; align-items: center; justify-content: center; min-width: var(--tap); min-height: var(--tap); padding: 0 var(--sp-3); border: 1.5px solid var(--color-ui); border-radius: var(--radius-s); font-weight: 600; font-size: var(--fs-small); background: var(--color-bg); transition: border-color var(--t-fast), background-color var(--t-fast), color var(--t-fast); }
.opt:hover .chip { border-color: var(--hm-black); }
.opt input:checked + .chip { background: var(--hm-black); border-color: var(--hm-black); color: var(--hm-white); }
.opt input:focus-visible + .chip, .opt input:focus-visible + .swatch { outline: 3px solid var(--color-focus); outline-offset: 3px; }
.opt input:disabled { cursor: not-allowed; }
.opt input:disabled + .chip { color: var(--color-ink-soft); border-style: dashed; text-decoration: line-through; background: transparent; }
.swatch { display: block; width: var(--tap); height: var(--tap); border-radius: 50%; background: var(--c, #ccc); border: 1px solid rgba(0, 0, 0, 0.25); box-shadow: inset 0 0 0 3px var(--color-bg); transition: box-shadow var(--t-fast); }
.opt input:checked + .swatch { box-shadow: inset 0 0 0 3px var(--color-bg), 0 0 0 2px var(--hm-black); }
.opt input:disabled + .swatch { opacity: 0.4; }

/* ---------- Control de cantidad ---------- */
.qty { justify-self: start; display: inline-grid; grid-template-columns: var(--tap) 3rem var(--tap); align-items: center; border: 1.5px solid var(--color-ui); border-radius: var(--radius-pill); overflow: hidden; }
.qty__btn { height: var(--tap); border: 0; background: transparent; cursor: pointer; font-size: 1.25rem; line-height: 1; transition: background-color var(--t-fast); }
.qty__btn:hover:not(:disabled) { background: var(--hm-gray-light); }
.qty__btn:disabled { color: var(--hm-gray-medium); cursor: not-allowed; }
.qty__btn:focus-visible { outline-offset: -3px; }
.qty__val { text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Avisos ---------- */
.notice { display: flex; gap: var(--sp-3); align-items: flex-start; padding: var(--sp-4); border-left: 4px solid var(--hm-black); border-radius: var(--radius-s); background: var(--hm-gray-soft); color: var(--hm-black); font-size: var(--fs-small); }
.notice__title { font-weight: 600; display: block; }
.notice--success { border-left-color: var(--hm-pink); }
.notice--warning { background: var(--hm-pink); }
.notice--error { background: var(--err-bg); border-left-color: var(--err-fg); }
.notice--error .notice__title { color: var(--err-fg); }

/* ---------- Estado vacío ---------- */
.empty { display: grid; justify-items: start; gap: var(--sp-3); padding: var(--sp-7) var(--sp-6); border: 1.5px dashed var(--hm-gray-light); border-radius: var(--radius-s); background: var(--color-bg); }
.empty__title { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: var(--fs-h3); }
.empty__text { color: var(--color-ink-soft); max-width: 46ch; }

/* ---------- Pie ---------- */
.site-footer { background: var(--hm-black); color: var(--hm-white); padding-block: var(--sp-7); }
.site-footer__inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-5); }
.site-footer__logo { height: 56px; width: auto; background: var(--hm-white); padding: 6px 10px; border-radius: var(--radius-s); }
.site-footer__note { font-size: var(--fs-small); color: var(--hm-gray-light); }

/* ---------- Aparición al hacer scroll (solo con JS) ---------- */
.js .reveal { opacity: 0; transform: translateY(24px); }
.js .reveal.in { opacity: 1; transform: none; transition: opacity 700ms ease var(--d, 0ms), transform 700ms var(--ease-out) var(--d, 0ms); }

@media (prefers-reduced-motion: reduce) {
  .js .reveal, .js .reveal.in { opacity: 1; transform: none; transition: none; }
  .btn, .btn svg, .chip, .swatch, .qty__btn, .nav__link, .card__media img { transition: none; }
  .btn:hover svg, .btn:active, .card:hover .card__media img { transform: none; }
  .announce__track { animation: none; transform: none; }
  .announce__link { justify-content: center; }
  .announce__group:nth-child(2) { display: none !important; }
  .announce__item:not(:first-child) { display: none; }
  .announce__item::after { display: none; }
}
</style>
  <style>/* HM Store — Hero Experience. Depende de tokens.css, base.css y components.css (.btn). */

/* ---------- Hero ---------- */
.hero {
  position: relative; isolation: isolate; overflow: hidden;
  background: var(--bg); color: var(--ink);
  min-height: clamp(560px, calc(100svh - var(--header-h) - var(--announce-h)), 900px);
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr);
  grid-template-areas: "content media";
  align-items: center;
  column-gap: clamp(1rem, 3vw, 2.5rem);
  padding: clamp(1.5rem, 4vw, 3.5rem) clamp(1.25rem, 5vw, 5rem);
  transition: background-color 400ms ease;
}

.hero__bg { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.hero__shape { position: absolute; border-radius: 50%; display: block; will-change: transform; }
.hero__shape--a {
  width: min(52vw, 640px); aspect-ratio: 1; right: -10vw; top: -18%;
  background: var(--accent); opacity: 0.12;
}
.hero__shape--b {
  width: min(22vw, 260px); aspect-ratio: 1; left: 38%; bottom: -8%;
  border: 1.5px solid var(--ink); opacity: 0.08;
}

/* Contenido */
.hero__content { grid-area: content; position: relative; z-index: 2; display: grid; gap: 1.5rem; justify-items: start; }
.hero__title {
  margin: 0; font-family: var(--font-display); font-weight: 500; font-style: italic;
  font-size: clamp(2.5rem, 7vw, 6.5rem);
  line-height: 0.95; letter-spacing: -0.02em; text-wrap: balance;
  overflow: hidden; padding-bottom: 0.08em;
}
/* Titular: cada palabra tiene su máscara; las palabras de una misma línea entran juntas */
.hero__title .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.08em 0.1em; margin: 0 -0.08em; }
.hero__title .w > i { display: inline-block; font-style: inherit; }
.hero__desc { margin: 0; max-width: 40ch; font-size: clamp(0.95rem, 1.2vw, 1.0625rem); line-height: 1.5; text-wrap: pretty; color: var(--ink); }

/* Botón del Hero */
.hero .btn { --btn-bg: var(--accent); --btn-fg: var(--ink); --btn-border: var(--accent); --btn-hover-bg: var(--ink); --btn-hover-fg: var(--bg); }

/* Medios: Galería */
.hero__media { grid-area: media; position: relative; width: 100%; z-index: 1; }
.hero__gallery {
  display: flex; gap: clamp(0.75rem, 2vw, 1.5rem); justify-content: flex-end; align-items: center;
  height: 100%; min-height: clamp(560px, calc(100svh - var(--header-h) - var(--announce-h)), 900px);
  padding: clamp(1.5rem, 4vw, 3.5rem) 0;
}

.hero__img-item {
  position: relative; flex: 1; min-width: 0;
  height: 100%; overflow: hidden;
  border-radius: 8px;
  background: var(--accent);
  aspect-ratio: auto;
}

.hero__img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center top;
  display: block;
}

.hero__img[hidden] { display: none; }

.hero__badge {
  position: absolute; left: 50%; bottom: 1rem; transform: translateX(-50%); z-index: 2;
  margin: 0; padding: 0.4rem 0.9rem; background: var(--ink); color: var(--bg);
  font-size: 0.6875rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600;
  white-space: nowrap; border-radius: 2px;
}

/* ---------- Secuencia de entrada (solo con JS) ---------- */
.js .hero:not(.is-ready) :is(.hero__bg, .hero__media, .hero__desc, .btn) { opacity: 0; }
.js .hero:not(.is-ready) .hero__title .w > i { transform: translateY(110%); }

.is-ready .hero__bg { animation: fade 900ms ease both; }
.is-ready .hero__shape--a { animation: settle 1400ms var(--ease-out) both; }
.is-ready .hero__media { animation: slide-in 800ms var(--ease-out) 120ms both; }
.is-ready .hero__img { animation: zoom-settle 1600ms var(--ease-out) 120ms both; }
.is-ready .hero__title .w > i { animation: line-up 900ms var(--ease-out) calc(220ms + var(--line, 0) * 110ms) both; }
.is-ready .hero__desc { animation: rise 700ms var(--ease-out) 380ms both; }
.is-ready .btn { animation: rise 700ms var(--ease-out) 480ms both; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes settle { from { opacity: 0; transform: scale(0.94); } to { opacity: 0.12; transform: none; } }
@keyframes slide-in { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes zoom-settle { from { transform: scale(1.05); } to { transform: none; } }
@keyframes line-up { from { transform: translateY(110%); } to { transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

/* Cambio de colección: salida breve, entrada coordinada */
.hero.is-leaving :is(.hero__media, .hero__content) {
  opacity: 0; transform: translateY(-10px);
  transition: opacity 220ms ease, transform 220ms ease;
}
.hero.is-entering :is(.hero__media, .hero__content) { animation: rise 500ms var(--ease-out) both; }

/* ---------- Tablet ---------- */
@media (max-width: 1024px) {
  .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
  .hero__title { font-size: clamp(2rem, 7vw, 4.5rem); }
  .hero__gallery { gap: clamp(0.5rem, 1.5vw, 1rem); }
}

/* ---------- Móvil y tablet vertical: composición apilada ---------- */
@media (max-width: 900px) {
  .hero {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "media" "content";
    align-items: start; row-gap: 0;
    min-height: auto; padding: 0 1.25rem;
  }
  .hero__media { width: 100%; }
  .hero__gallery {
    flex-wrap: wrap;
    justify-content: center;
    height: auto;
    min-height: auto;
    padding: 1.25rem 0 2.5rem;
    gap: 0.75rem;
  }
  .hero__img-item {
    flex: 0 1 calc(50% - 0.375rem);
    height: 280px;
    border-radius: 6px;
  }
  .hero__img-item:nth-child(2) {
    flex: 1 1 100%;
    height: 360px;
  }
  .hero__content { padding: 0 0 1.5rem; gap: 1rem; }
  .hero__title { font-size: clamp(1.75rem, 12vw, 3rem); line-height: 1; }
  .hero__desc { max-width: 100%; font-size: 0.95rem; }
  .btn { width: 100%; max-width: none; justify-content: center; }
  .hero__shape--a { width: 90vw; right: -30vw; top: -8%; opacity: 0.08; }
  .hero__shape--b { display: none; }
}

/* ---------- Móvil pequeño ---------- */
@media (max-width: 480px) {
  .hero {
    padding: 0 1rem;
  }
  .hero__gallery {
    padding: 1rem 0 2rem;
  }
  .hero__img-item {
    flex: 1 1 100%;
    height: 240px;
  }
  .hero__img-item:nth-child(2) {
    flex: 1 1 100%;
    height: 240px;
  }
  .hero__img-item:nth-child(3) {
    flex: 1 1 100%;
    height: 240px;
  }
  .hero__title { font-size: clamp(1.5rem, 10vw, 2.5rem); }
  .hero__desc { font-size: 0.9rem; }
}

/* ---------- Movimiento reducido ---------- */
@media (prefers-reduced-motion: reduce) {
  .is-ready .hero__bg, .is-ready .hero__shape--a, .is-ready .hero__media,
  .is-ready .hero__img, .is-ready .hero__title .w > i,
  .is-ready .hero__desc, .is-ready .btn, .hero.is-entering :is(.hero__media, .hero__content) {
    animation: fade 200ms linear both;
  }
  .is-ready .hero__shape--a { animation-name: fade-shape; }
  @keyframes fade-shape { from { opacity: 0; } to { opacity: 0.12; } }
  .hero.is-leaving :is(.hero__media, .hero__content) { transform: none; transition: opacity 150ms linear; }
}
</style>

  <script>/* HM Store — Hero Experience (Fase 2). Sin dependencias.
 * Lee window.HM_DATA (data/campaigns.js). Todo el texto se inserta con
 * textContent; nunca se inyecta HTML desde los datos. */
(function () {
  "use strict";

  var data = window.HM_DATA;
  var root = document.documentElement;
  var hero = document.getElementById("hero");
  if (!data || !data.featured || !hero) {
    console.error("[HM Hero] Falta window.HM_DATA.featured o el contenedor #hero.");
    return;
  }

  var el = {
    title: document.getElementById("hero-title-text"),
    desc: document.getElementById("hero-desc"),
    cta: document.getElementById("hero-cta"),
    ctaText: document.getElementById("hero-cta-text"),
    gallery: document.getElementById("hero-gallery"),
    badge: document.getElementById("hero-badge"),
    announce: document.getElementById("announce"),
    announceLink: document.getElementById("announce-link"),
    announceTrack: document.getElementById("announce-track"),
    announceText: document.getElementById("announce-text"),
  };

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  var current = null;
  var busy = false;

  /* Devuelve un destino seguro o null. Solo rutas relativas, anclas o http(s);
   * evita esquemas como javascript:. Un ancla (#x) solo es válida si existe en la página. */
  function safeHref(href) {
    if (typeof href !== "string" || !href) return null;
    if (href.charAt(0) === "#") {
      return href.length > 1 && document.getElementById(href.slice(1)) ? href : null;
    }
    if (/^(\/|\.\/|\.\.\/)/.test(href) || /^https?:\/\//i.test(href)) return href;
    return /^[\w\-./]+$/.test(href) ? href : null;
  }

  /* Un enlace sin destino válido NO se enlaza a ningún sitio: queda como botón
   * deshabilitado (aria-disabled) hasta que HM defina el destino real. */
  function setLink(a, href) {
    var ok = safeHref(href);
    if (ok) {
      a.setAttribute("href", ok);
      a.removeAttribute("aria-disabled");
    } else {
      a.removeAttribute("href");
      a.setAttribute("aria--disabled", "true");
    }
  }

  function applyTheme(theme) {
    var s = root.style;
    if (!theme) return;
    if (theme.bg) s.setProperty("--bg", theme.bg);
    if (theme.ink) s.setProperty("--ink", theme.ink);
    if (theme.accent) s.setProperty("--accent", theme.accent);
  }

  /* Renderiza la galería de imágenes desde gallery array */
  function renderGallery(gallery, provisional) {
    if (!gallery || !Array.isArray(gallery) || gallery.length === 0) {
      el.gallery.innerHTML = "";
      return;
    }

    el.gallery.innerHTML = "";
    gallery.forEach(function (item, index) {
      var itemDiv = document.createElement("div");
      itemDiv.className = "hero__img-item";

      var img = document.createElement("img");
      img.className = "hero__img";
      img.alt = item.alt || "Modelo de la colección";
      img.src = item.src;
      img.decoding = "async";
      if (index === 0) img.fetchPriority = "high";

      itemDiv.appendChild(img);
      el.gallery.appendChild(itemDiv);
    });

    // Mostrar badge si es provisional
    el.badge.hidden = !provisional;
  }

  /* Titular por líneas: cada palabra va en su máscara (sin innerHTML). Tras el layout se
   * agrupan por línea (offsetTop) y cada línea recibe su retardo --line. */
  function setTitle(text) {
    el.title.textContent = "";
    text.split(/\s+/).filter(Boolean).forEach(function (word, i, all) {
      var w = document.createElement("span");
      w.className = "w";
      var inner = document.createElement("i");
      inner.textContent = word;
      w.appendChild(inner);
      el.title.appendChild(w);
      if (i < all.length - 1) el.title.appendChild(document.createTextNode(" "));
    });
    var words = el.title.querySelectorAll(".w");
    var line = -1, lastTop = null;
    for (var k = 0; k < words.length; k++) {
      var top = words[k].offsetTop;
      if (lastTop === null || Math.abs(top - lastTop) > 4) { line++; lastTop = top; }
      words[k].style.setProperty("--line", line);
    }
  }

  function fill(c) {
    setTitle(c.title || "");
    el.desc.textContent = c.description || "";
    el.desc.hidden = !c.description;
    el.ctaText.textContent = (c.cta && c.cta.label) || "";
    setLink(el.cta, c.cta && c.cta.href);
    el.cta.hidden = !(c.cta && c.cta.label);
    applyTheme(c.theme);
    renderGallery(c.gallery, c.provisional);
    current = c;
  }

  function afterAnimation(node, done, fallbackMs) {
    var finished = false;
    function end() { if (finished) return; finished = true; done(); }
    node.addEventListener("transitionend", end, { once: true });
    setTimeout(end, fallbackMs);
  }

  /* Cambio de colección: salida breve del contenido anterior y entrada del nuevo.
   * El grid mantiene la altura, así que la sección no salta de tamaño. */
  function setCampaign(next) {
    if (!next || busy) return;
    if (!current || reduceMotion.matches && !hero.classList.contains("is-ready")) {
      fill(next);
      return;
    }
    busy = true;
    hero.classList.add("is-leaving");
    afterAnimation(hero.querySelector(".hero__content"), function () {
      fill(next);
      hero.classList.remove("is-leaving");
      hero.classList.add("is-entering");
      setTimeout(function () {
        hero.classList.remove("is-entering");
        busy = false;
      }, 600);
    }, reduceMotion.matches ? 180 : 260);
  }

  /* ---------- Cinta de anuncio ---------- */
  function setAnnouncement(a) {
    var on = a && a.enabled && a.message;
    el.announce.hidden = !on;
    root.style.setProperty("--announce-h", on ? el.announce.offsetHeight + "px" : "0px");
    if (!on) { el.announceTrack.textContent = ""; return; }

    setLink(el.announceLink, a.href);
    el.announceText.textContent = a.message;

    // Dos grupos idénticos para un bucle continuo; cada grupo se repite hasta cubrir el ancho.
    el.announceTrack.textContent = "";
    function group() {
      var g = document.createElement("span");
      g.className = "announce__group";
      g.style.display = "inline-flex";
      for (var i = 0; i < 4; i++) {
        var it = document.createElement("span");
        it.className = "announce__item";
        it.textContent = a.message;
        g.appendChild(it);
      }
      return g;
    }
    el.announceTrack.appendChild(group());
    el.announceTrack.appendChild(group());

    var half = el.announceTrack.scrollWidth / 2;
    var pxPerSecond = 45; // velocidad moderada y legible
    el.announceTrack.style.setProperty("--marquee-duration", Math.max(15, half / pxPerSecond) + "s");
    root.style.setProperty("--announce-h", el.announce.offsetHeight + "px");
  }

  /* ---------- Parallax discreto del fondo (solo puntero fino, escritorio) ---------- */
  function initParallax() {
    var fine = window.matchMedia("(pointer: fine) and (min-width: 1025px)");
    var shapes = hero.querySelectorAll(".hero__shape");
    var raf = 0, tx = 0, ty = 0;
    function frame() {
      raf = 0;
      shapes[0].style.transform = "translate3d(" + tx * -10 + "px," + ty * -8 + "px,0)";
      if (shapes[1]) shapes[1].style.transform = "translate3d(" + tx * 14 + "px," + ty * 10 + "px,0)";
    }
    hero.addEventListener("pointermove", function (e) {
      if (!fine.matches || reduceMotion.matches) return;
      var r = hero.getBoundingClientRect();
      tx = (e.clientX - r.left) / r.width - 0.5;
      ty = (e.clientY - r.top) / r.height - 0.5;
      if (!raf) raf = requestAnimationFrame(frame);
    }, { passive: true });
  }

  /* ---------- Arranque ---------- */
  fill(data.featured);
  setAnnouncement(data.announcement);
  initParallax();

  function start() {
    // Se espera a que las imágenes carguen (máx. 1,5 s) para que la entrada sea fluida.
    requestAnimationFrame(function () { hero.classList.add("is-ready"); });
  }

  // Esperar a las imágenes de la galería
  var images = el.gallery.querySelectorAll("img");
  if (images.length > 0) {
    var loadedCount = 0;
    var started = false;

    function checkAllLoaded() {
      if (loadedCount === images.length && !started) {
        started = true;
        start();
      }
    }

    var timeout = setTimeout(function () {
      if (!started) {
        started = true;
        start();
      }
    }, 1500);

    images.forEach(function (img) {
      function onLoad() {
        loadedCount++;
        checkAllLoaded();
      }
      img.addEventListener("load", onLoad, { once: true });
      img.addEventListener("error", onLoad, { once: true });
      if (img.complete) onLoad();
    });
  } else {
    start();
  }

  window.HMHero = { setCampaign: setCampaign, setAnnouncement: setAnnouncement };
})();
</script>

  <script>/* HM Store — aparición suave al entrar en pantalla. Sin dependencias; sin JS o sin IntersectionObserver todo queda visible. */
(function () {
  "use strict";
  var nodes = document.querySelectorAll(".section-head, .notice, .reveal");
  nodes.forEach(function (n) { n.classList.add("reveal"); });
  if (!("IntersectionObserver" in window)) { nodes.forEach(function (n) { n.classList.add("in"); }); return; }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
  nodes.forEach(function (n) { io.observe(n); });
})();
</script>
