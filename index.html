<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HM Boutique</title>
  <meta name="description" content="HM Boutique — tienda de moda multimarca.">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Hanken+Grotesk:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/hero.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <!-- Cinta de anuncio: datos desde data/campaigns.js (oculta si no está activa) -->
  <div class="announce" id="announce" hidden>
    <a class="announce__link" id="announce-link" href="#">
      <span class="announce__track" id="announce-track" aria-hidden="true"></span>
      <span class="sr-only" id="announce-text"></span>
    </a>
  </div>

  <!-- Cabecera: solo enlaza a secciones que existen. Se añadirán enlaces (categorías, carrito) cuando existan sus destinos. -->
  <header class="site-header">
    <nav class="nav" aria-label="Principal">
      <a class="nav__link" href="#coleccion">Colección</a>
    </nav>
    <a href="index.html" class="site-header__logo" aria-label="HM Boutique, inicio">
      <img src="assets/brand/logo-hm-boutique-recortado.png" alt="HM Boutique" width="366" height="295">
    </a>
  </header>

  <main id="contenido">
    <section class="hero" id="hero" aria-labelledby="hero-title">
      <div class="hero__bg" id="hero-bg" aria-hidden="true">
        <img class="hero__bg-img" id="hero-bg-img" alt="" hidden decoding="async">
        <div class="hero__bg-overlay"></div>
        <i class="hero__shape hero__shape--a"></i><i class="hero__shape hero__shape--b"></i>
      </div>

      <div class="hero__content" id="hero-content">
        <h1 class="hero__title" id="hero-title"><span id="hero-title-text"></span></h1>
        <p class="hero__desc" id="hero-desc"></p>
        <a class="btn" id="hero-cta" href="#"><span id="hero-cta-text"></span><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <p class="hero__badge" id="hero-badge" hidden>Contenido provisional</p>
      </div>
    </section>

    <!-- Catálogo: aún sin productos reales. Se alimentará del sistema de catálogo (fase posterior). -->
    <section class="section" id="coleccion" aria-labelledby="coleccion-title">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow">Colección</p>
          <h2 class="section-head__title" id="coleccion-title">Animal Print</h2>
        </div>
        <div class="notice" role="note"><div><span class="notice__title">Vista provisional</span><p>Fotografías reales de la colección. Nombres, precios, tallas y disponibilidad están pendientes de confirmar por HM.</p></div></div>
        <ul class="product-grid" id="product-grid" style="margin-top:var(--sp-6)"></ul>
        <noscript><p>Activa JavaScript para ver las fotografías de la colección.</p></noscript>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <img class="site-footer__logo" src="assets/brand/logo-hm-boutique-recortado.png" alt="HM Boutique" width="366" height="295">
      <p class="site-footer__note">© HM Boutique</p>
    </div>
  </footer>

  <noscript><p style="padding:2rem;font-family:sans-serif">Activa JavaScript para ver la campaña.</p></noscript>

  <script src="data/campaigns.js"></script>
  <script src="data/products.js"></script>
  <script src="js/hero.js"></script>
  <script src="js/collection.js"></script>
  <script src="js/reveal.js"></script>
</body>
</html>
